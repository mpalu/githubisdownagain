<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Status: Predictable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #e6e6e6;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .message {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.6;
            font-style: italic;
            margin-top: 30px;
        }

        .blink {
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🐙💔</div>
        <h1>GitHub is Down</h1>
        <p class="message">
            Another day, another outage.<br>
            The world's largest code hosting platform, ladies and gentlemen.
        </p>
        <p class="message">
            Your commits? In limbo.<br>
            Your CI/CD? <span class="blink">Crying</span>.<br>
            Your productivity? Paused.
        </p>
        <p class="tagline">
            "Where the world builds software"<br>
            ...when it's actually online.
        </p>
    </div>
</body>
</html>
